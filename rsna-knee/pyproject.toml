[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-knee"
version = "1.0.0"
description = "KAIROS - Knee Abnormality Inference with Report-Optimised Supervision (RSNA 2026)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
train = ["torch>=2.1", "timm>=1.0", "pydicom>=2.4", "pyarrow>=14", "scipy>=1.11", "PyYAML>=6"]
dev = ["pytest>=7.4", "scipy>=1.11", "pydicom>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # Tests assert on scalars taken from grad-carrying tensors, e.g.
    # ``assert float(loss(z, y)) < ...``.  torch warns because in *library*
    # code that usually signals an accidental graph detach; in an assertion it
    # is harmless and wrapping every one in ``no_grad`` obscures what is being
    # checked.  Scoped to the test suite only -- library code must stay clean.
    "ignore:Converting a tensor with requires_grad:UserWarning",
]
